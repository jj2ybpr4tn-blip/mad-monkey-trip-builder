<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>og-home</title>
<!-- Poster for the homepage link preview. Rendered to assets/og/home.jpg by:  npm run og-home  (see package.json). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&family=Bungee&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0a;color:#fff;font-family:Montserrat,system-ui,sans-serif}
.p{position:relative;width:1200px;height:630px;background:#0a0a0a;display:grid;grid-template-columns:620px 1fr}
.l{padding:44px 0 0 56px;display:flex;flex-direction:column;gap:18px;z-index:2}
.eyebrow{color:#ccff01;font-weight:700;font-size:20px;letter-spacing:.28em;text-transform:uppercase}
h1{margin:0;font-weight:900;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;font-size:76px}
h1 .hl{background:#ccff01;color:#0a0a0a;padding:0 .1em}
.sub{font-weight:500;font-size:22px;line-height:1.35;max-width:500px;color:#e8e4d8}
.pill{align-self:flex-start;background:#ff01aa;color:#0a0a0a;font-weight:900;font-size:21px;letter-spacing:.1em;text-transform:uppercase;border:4px solid #fff;padding:10px 24px;border-radius:999px;box-shadow:6px 6px 0 #ccff01;margin-top:6px}
.r{position:relative}
.r svg{position:absolute;right:-60px;top:-20px;height:640px;width:auto}
.burst{position:absolute;right:40px;bottom:60px;width:170px;height:170px;display:grid;place-items:center;text-align:center;background:#ccff01;color:#0a0a0a;font-weight:900;font-size:26px;line-height:1;clip-path:polygon(50% 0%,58% 9%,70% 3%,74% 14%,86% 14%,87% 26%,97% 31%,92% 43%,100% 52%,92% 61%,97% 73%,86% 77%,85% 89%,73% 88%,67% 99%,57% 92%,47% 100%,41% 91%,29% 97%,26% 86%,14% 84%,15% 72%,4% 66%,10% 55%,0 47%,9% 38%,3% 27%,15% 23%,16% 11%,28% 13%,33% 2%,43% 9%)}
.logo{position:absolute;left:56px;bottom:30px;height:44px;z-index:2}
</style></head>
<body><div class="p"><div class="l"><div class="eyebrow">Mad Monkey · Trip Builder</div><h1>Build the trip you <span class="hl">actually</span> want.</h1>
<div class="sub">23 hostels, 6 countries. Every bus, boat and flight in between. Checked by a real person before you pay.</div><div class="pill">Build your trip</div></div>
<div class="r" id="map"></div><div class="burst"><span>23<br>hostels</span></div><img class="logo" src="../assets/logo/mad-monkey-white.png" alt=""></div>
<script src="../data/map-data.js"></script><script src="../data/places.js"></script><script src="../data/activities.js"></script><script src="../data/media.js"></script><script src="../data/legs.js"></script><script src="../data/trips.js"></script><script src="../logic.js"></script><script src="../ui-map.js"></script>
<script>
document.getElementById('map').innerHTML = MM.staticMap({ region: 'all', aspect: 0.9, pad: 0, dots: true, countryLabels: false, px: 560, slice: true, other: false, animate: false,
  routes: [['bangkok', 'chiang-mai', 'luang-prabang', 'hanoi', 'hoi-an'], ['uluwatu', 'gili-trawangan'], ['panglao', 'siargao']] });
</script></body></html>
